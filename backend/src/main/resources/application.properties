spring.application.name=backend-johyeonmin-scope
server.port=8080

spring.datasource.url=jdbc:h2:mem:backend_scope;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=backend-johyeonmin-scope-demo-secret-key-for-jjwt-2026
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
